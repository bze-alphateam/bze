syntax = "proto3";
package bze.tradebin.v2;

import "gogoproto/gogo.proto";
import "cosmos/base/v1beta1/coin.proto";

option go_package = "github.com/bze-alphateam/bze/x/tradebin/v2types";

// Params defines the parameters for the module with proper types
// for fee fields (migrated from string to cosmos.base.v1beta1.Coin).
message Params {
  cosmos.base.v1beta1.Coin createMarketFee = 1 [
    (gogoproto.nullable) = false,
    (gogoproto.moretags) = "yaml:\"create_market_fee\""
  ];
  cosmos.base.v1beta1.Coin marketMakerFee = 2 [
    (gogoproto.nullable) = false,
    (gogoproto.moretags) = "yaml:\"market_maker_fee\""
  ];
  cosmos.base.v1beta1.Coin marketTakerFee = 3 [
    (gogoproto.nullable) = false,
    (gogoproto.moretags) = "yaml:\"market_taker_fee\""
  ];
  string makerFeeDestination = 4 [(gogoproto.moretags) = "yaml:\"maker_fee_destination\""];
  string takerFeeDestination = 5 [(gogoproto.moretags) = "yaml:\"taker_fee_destination\""];
  string native_denom = 6 [(gogoproto.moretags) = "yaml:\"native_denom\""];
  uint64 orderBookExtraGasWindow = 7 [(gogoproto.moretags) = "yaml:\"order_book_extra_gas_window\""];
  uint64 orderBookQueueExtraGas = 8 [(gogoproto.moretags) = "yaml:\"order_book_queue_extra_gas\""];
  uint64 fillOrdersExtraGas = 9 [(gogoproto.moretags) = "yaml:\"fill_orders_extra_gas\""];
  string minNativeLiquidityForModuleSwap = 10 [
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (gogoproto.moretags) = "yaml:\"min_native_liquidity_for_module_swap\""
  ];
  // maximum number of resting orders one order examines (filled or skipped); the remainder is refunded
  uint64 maxFillsPerOrder = 11 [(gogoproto.moretags) = "yaml:\"max_fills_per_order\""];
  // 12 was orderBookQueueMessageScanExtraGas (removed in v8.3.0)
  reserved 12;
}
