syntax = "proto3";
package bze.tradebin;

import "amino/amino.proto";
import "gogoproto/gogo.proto";
import "cosmos/base/v1beta1/coin.proto";
import "bze/tradebin/store.proto";

option go_package = "github.com/bze-alphateam/bze/x/tradebin/types";

message MarketCreatedEvent {
  string creator = 1;
  string base = 2;
  string quote = 3;
}

message OrderExecutedEvent {
  string id = 1;
  string market_id = 2;
  string order_type = 3;
  string amount = 4;
  string price = 5;
  string maker = 6;
  string taker = 7;
  // id of the taker order that executed against this (maker) order, zero-filled.
  // Every taker gets an order id, even when it never rests on the book.
  string order_id = 8;
}

message OrderCanceledEvent {
  string id = 1;
  string market_id = 2;
  string order_type = 3;
  string amount = 4;
  string price = 5;
  string owner = 6;
  // id of the cancelled order (same as id)
  string order_id = 7;
}

message OrderSavedEvent {
  string id = 1;
  string market_id = 2;
  string order_type = 3;
  string amount = 4;
  string price = 5;
  string owner = 6;
  // id of the order that placed this remainder on the book (same as id)
  string order_id = 7;
}

// OrderAmendedEvent is emitted when the remainder of an order is added to the order its owner already
// rests at the same market, side and price: the resting order keeps its id and place in the book.
message OrderAmendedEvent {
  string id = 1;
  string market_id = 2;
  string order_type = 3;
  string price = 4;
  string owner = 5;
  // amount added to the resting order
  string added_amount = 6;
  // amount of the resting order after the addition
  string amount = 7;
}

message PoolCreatedEvent {
  string creator = 1;
  string base = 2;
  string quote = 3;
  // lp_denom is the denom of the pool's LP token ("ulp/<hash>"). Emitted so
  // off-chain consumers don't have to derive it from base/quote.
  string lp_denom = 4;
}

message LiquidityAddedEvent {
  string creator = 1;
  string baseAmount = 2 [
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable)   = false
  ];
  string quoteAmount = 3 [
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable)   = false
  ];
  string mintedAmount = 4 [
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable)   = false
  ];
  string pool_id = 5;
}

message LiquidityRemovedEvent {
  string creator = 1;
  string baseAmount = 2 [ // Fee ex: 0.001 = 0.1%
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable)   = false
  ];
  string quoteAmount = 3 [ // Fee ex: 0.001 = 0.1%
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable)   = false
  ];
  string pool_id = 4;
}

message SwapEvent {
  string creator = 1;
  cosmos.base.v1beta1.Coin in = 2 [
    (gogoproto.nullable)     = false,
    (gogoproto.moretags)     = "yaml:\"in\"",
    (gogoproto.jsontag)      = "in,omitempty"
  ];
  cosmos.base.v1beta1.Coin out = 3 [
    (gogoproto.nullable)     = false,
    (gogoproto.moretags)     = "yaml:\"out\"",
    (gogoproto.jsontag)      = "out,omitempty"
  ];
  string pool_id = 4;
}

// DenomHaltedEvent is emitted for every denom a MsgHaltDenoms proposal actually halts (not for denoms
// that were already halted).
message DenomHaltedEvent {
  string denom = 1;
}

// DenomUnhaltedEvent is emitted for every denom a MsgUnhaltDenoms proposal actually un-halts (not for
// denoms that were not halted).
message DenomUnhaltedEvent {
  string denom = 1;
}

// PoolFeesUpdatedEvent is emitted for every pool a MsgUpdatePools proposal actually changes (not for
// entries equal to the pool's current values).
message PoolFeesUpdatedEvent {
  string pool_id = 1;
  string old_fee = 2;
  string new_fee = 3;
  FeeDestination old_fee_dest = 4 [(gogoproto.nullable) = false];
  FeeDestination new_fee_dest = 5 [(gogoproto.nullable) = false];
}

// OrderMessageRefundedEvent is emitted when the unexecuted part of an order is
// returned to its owner instead of resting on the book, in the same transaction.
// Without it a fill order with no match would leave no trace of its processing.
message OrderMessageRefundedEvent {
  // id of the refunded order, zero-filled (for reason "upgrade": the id of the
  // queue message refunded by the v8.3.0 migration)
  string order_id = 1;
  string market_id = 2;
  // the side of the refunded order
  string order_type = 3;
  string owner = 4;
  // base-denom amount of the order that was not executed
  string amount = 5;
  // the coin actually sent back (coin string); empty when it rounded to zero
  // and only dust was stored
  string refund = 6;
  // no_match | unfilled_remainder | below_min_amount | upgrade
  string reason = 7;
}
