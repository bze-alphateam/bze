syntax = "proto3";
package bze.tradebin;

import "amino/amino.proto";
import "gogoproto/gogo.proto";
import "cosmos/base/v1beta1/coin.proto";

option go_package = "github.com/bze-alphateam/bze/x/tradebin/types";

message OrderCreateMessageEvent {
  string creator = 1;
  string market_id = 2;
  string order_type = 3;
  string amount = 4;
  string price = 5;
  // queue message id, zero-filled 24 digits. Not reused while the message is
  // queued: the counter resets only once the queue is empty, and a message can
  // be processed in a later block than its tx (per-block limit, retry on error).
  string message_id = 6;
}

message OrderCancelMessageEvent {
  string creator = 1;
  string marketId = 2;
  string orderId = 3;
  string order_type = 4;
  // queue message id, zero-filled 24 digits. Not reused while the message is
  // queued: the counter resets only once the queue is empty, and a message can
  // be processed in a later block than its tx (per-block limit, retry on error).
  string message_id = 5;
}

message MarketCreatedEvent {
  string creator = 1;
  string base = 2;
  string quote = 3;
}

message OrderExecutedEvent {
  string id = 1;
  string market_id = 2;
  string order_type = 3;
  string amount = 4;
  string price = 5;
  string maker = 6;
  string taker = 7;
  // queue message id, zero-filled 24 digits. Not reused while the message is
  // queued: the counter resets only once the queue is empty, and a message can
  // be processed in a later block than its tx (per-block limit, retry on error).
  string message_id = 8;
}

message OrderCanceledEvent {
  string id = 1;
  string market_id = 2;
  string order_type = 3;
  string amount = 4;
  string price = 5;
  string owner = 6;
  // queue message id, zero-filled 24 digits. Not reused while the message is
  // queued: the counter resets only once the queue is empty, and a message can
  // be processed in a later block than its tx (per-block limit, retry on error).
  string message_id = 7;
}

message OrderSavedEvent {
  string id = 1;
  string market_id = 2;
  string order_type = 3;
  string amount = 4;
  string price = 5;
  string owner = 6;
  // queue message id, zero-filled 24 digits. Not reused while the message is
  // queued: the counter resets only once the queue is empty, and a message can
  // be processed in a later block than its tx (per-block limit, retry on error).
  string message_id = 7;
}

message PoolCreatedEvent {
  string creator = 1;
  string base = 2;
  string quote = 3;
  // lp_denom is the denom of the pool's LP token ("ulp/<hash>"). Emitted so
  // off-chain consumers don't have to derive it from base/quote.
  string lp_denom = 4;
}

message LiquidityAddedEvent {
  string creator = 1;
  string baseAmount = 2 [
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable)   = false
  ];
  string quoteAmount = 3 [
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable)   = false
  ];
  string mintedAmount = 4 [
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable)   = false
  ];
  string pool_id = 5;
}

message LiquidityRemovedEvent {
  string creator = 1;
  string baseAmount = 2 [ // Fee ex: 0.001 = 0.1%
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable)   = false
  ];
  string quoteAmount = 3 [ // Fee ex: 0.001 = 0.1%
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable)   = false
  ];
  string pool_id = 4;
}

message SwapEvent {
  string creator = 1;
  cosmos.base.v1beta1.Coin in = 2 [
    (gogoproto.nullable)     = false,
    (gogoproto.moretags)     = "yaml:\"in\"",
    (gogoproto.jsontag)      = "in,omitempty"
  ];
  cosmos.base.v1beta1.Coin out = 3 [
    (gogoproto.nullable)     = false,
    (gogoproto.moretags)     = "yaml:\"out\"",
    (gogoproto.jsontag)      = "out,omitempty"
  ];
  string pool_id = 4;
}

// DenomHaltedEvent is emitted for every denom a MsgHaltDenoms proposal actually halts (not for denoms
// that were already halted).
message DenomHaltedEvent {
  string denom = 1;
}

// DenomUnhaltedEvent is emitted for every denom a MsgUnhaltDenoms proposal actually un-halts (not for
// denoms that were not halted).
message DenomUnhaltedEvent {
  string denom = 1;
}

// OrderMessageRefundedEvent is emitted by the EndBlock order book engine when
// the unexecuted part of a queued message is returned to its owner. Without it
// a fill message with no match would leave no trace of its processing.
message OrderMessageRefundedEvent {
  // queue message id, zero-filled 24 digits (see OrderCreateMessageEvent)
  string message_id = 1;
  string market_id = 2;
  // the side of the queue message
  string order_type = 3;
  string owner = 4;
  // base-denom amount of the message that was not executed
  string amount = 5;
  // the coin actually sent back (coin string); empty when it rounded to zero
  // and only dust was stored
  string refund = 6;
  // no_match | unfilled_remainder | below_min_amount
  string reason = 7;
}

// OrderCancelSkippedEvent is emitted when a queued cancel finds no order to
// cancel (it was filled or cancelled in the meantime). The message is removed
// from the queue and nothing else happens.
message OrderCancelSkippedEvent {
  // queue message id, zero-filled 24 digits (see OrderCreateMessageEvent)
  string message_id = 1;
  string market_id = 2;
  string order_type = 3;
  string order_id = 4;
  // the sender of the cancel
  string owner = 5;
  // order_not_found
  string reason = 6;
}

// OrderMessageFailedEvent is emitted when processing a queued message fails.
// Its writes are discarded and the message stays queued: it is retried next
// block and this event is emitted again for every block it fails.
message OrderMessageFailedEvent {
  // queue message id, zero-filled 24 digits (see OrderCreateMessageEvent)
  string message_id = 1;
  string market_id = 2;
  // the queue message type: buy | sell | cancel | fill_buy | fill_sell
  string message_type = 3;
  string owner = 4;
  // processing_error (a fixed value, never the error text)
  string reason = 5;
}
