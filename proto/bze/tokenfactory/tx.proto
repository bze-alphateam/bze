syntax = "proto3";

package bze.tokenfactory;

import "amino/amino.proto";
import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";
import "cosmos/bank/v1beta1/bank.proto";
import "bze/tokenfactory/params.proto";
import "bze/tokenfactory/denom_branding.proto";

option go_package = "github.com/bze-alphateam/bze/x/tokenfactory/types";

// Msg defines the Msg service.
service Msg {
  option (cosmos.msg.v1.service) = true;
  
  // UpdateParams defines a (governance) operation for updating the module
  // parameters. The authority defaults to the x/gov module account.
  rpc UpdateParams     (MsgUpdateParams    ) returns (MsgUpdateParamsResponse    );
  rpc CreateDenom      (MsgCreateDenom     ) returns (MsgCreateDenomResponse     );
  rpc Mint             (MsgMint            ) returns (MsgMintResponse            );
  rpc Burn             (MsgBurn            ) returns (MsgBurnResponse            );
  rpc ChangeAdmin      (MsgChangeAdmin     ) returns (MsgChangeAdminResponse     );
  rpc SetDenomMetadata (MsgSetDenomMetadata) returns (MsgSetDenomMetadataResponse);
  rpc SetDenomBranding (MsgSetDenomBranding) returns (MsgSetDenomBrandingResponse);

  // SetDenomAdmin assigns a new admin to a factory denom.
  // Governance only (authority = the x/gov module account).
  rpc SetDenomAdmin    (MsgSetDenomAdmin   ) returns (MsgSetDenomAdminResponse   );

  // DisableMinting turns minting off for good on a factory denom.
  // Admin only and irreversible: no message turns it back on.
  rpc DisableMinting   (MsgDisableMinting  ) returns (MsgDisableMintingResponse  );
}
// MsgUpdateParams is the Msg/UpdateParams request type.
message MsgUpdateParams {
  option (cosmos.msg.v1.signer) =                          "authority";
  option           (amino.name) = "bze/x/tokenfactory/MsgUpdateParams";
  
  // authority is the address that controls the module (defaults to x/gov unless overwritten).
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // params defines the module parameters to update.
  
  // NOTE: All parameters must be supplied.
  Params params = 2 [(gogoproto.nullable) = false, (amino.dont_omitempty) = true];
}

// MsgUpdateParamsResponse defines the response structure for executing a
// MsgUpdateParams message.
message MsgUpdateParamsResponse {}

message MsgCreateDenom {
  option           (amino.name) = "bze/x/tokenfactory/MsgCreateDenom";
  option (cosmos.msg.v1.signer) = "creator";
  string creator  = 1;
  string subdenom = 2;
}

message MsgCreateDenomResponse {
  string new_denom = 1;
}

message MsgMint {
  option           (amino.name) = "bze/x/tokenfactory/MsgMint";
  option (cosmos.msg.v1.signer) = "creator";
  string creator = 1;
  string coins   = 2;
}

message MsgMintResponse {}

message MsgBurn {
  option           (amino.name) = "bze/x/tokenfactory/MsgBurn";
  option (cosmos.msg.v1.signer) = "creator";
  string creator = 1;
  string coins   = 2;
}

message MsgBurnResponse {}

message MsgChangeAdmin {
  option           (amino.name) = "bze/x/tokenfactory/MsgChangeAdmin";
  option (cosmos.msg.v1.signer) = "creator";
  string creator  = 1;
  string denom    = 2;
  string newAdmin = 3;
}

message MsgChangeAdminResponse {}

message MsgSetDenomMetadata {
  option           (amino.name) = "bze/x/tokenfactory/MsgSetDenomMetadata";
  option (cosmos.msg.v1.signer) = "creator";
  string creator = 1;

  cosmos.bank.v1beta1.Metadata metadata = 2 [
    (gogoproto.moretags) = "yaml:\"metadata\"",
    (gogoproto.nullable) = false
  ];
}

message MsgSetDenomMetadataResponse {}

message MsgSetDenomBranding {
  option           (amino.name) = "bze/x/tokenfactory/MsgSetDenomBranding";
  option (cosmos.msg.v1.signer) = "creator";
  string creator = 1;
  string denom   = 2;

  // branding is the full package to store. A nil/empty branding clears any
  // stored branding for the denom.
  DenomBranding branding = 3;
}

message MsgSetDenomBrandingResponse {}


// MsgSetDenomAdmin is the governance message that assigns a new admin to a factory denom,
// whatever its current admin is (including a renounced denom whose admin is empty).
message MsgSetDenomAdmin {
  option (cosmos.msg.v1.signer) =                          "authority";
  option           (amino.name) = "bze/x/tokenfactory/MsgSetDenomAdmin";

  // authority is the address that controls the module (defaults to x/gov unless overwritten).
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // denom is the full factory denom, e.g. factory/bze1.../mytoken.
  string denom = 2;

  // new_admin is the account that becomes admin. Must not be empty.
  string new_admin = 3 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}

message MsgSetDenomAdminResponse {}

// MsgDisableMinting turns minting off for good on a factory denom. Only the denom admin may send it.
// The admin keeps every other right (burn, metadata, branding, admin change).
message MsgDisableMinting {
  option (cosmos.msg.v1.signer) = "creator";
  option           (amino.name) = "bze/x/tokenfactory/MsgDisableMinting";
  string creator = 1;
  string denom   = 2;
}

message MsgDisableMintingResponse {}
