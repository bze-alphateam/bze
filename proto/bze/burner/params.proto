syntax = "proto3";
package bze.burner;

import "amino/amino.proto";
import "gogoproto/gogo.proto";
import "cosmos_proto/cosmos.proto";

option go_package = "github.com/bze-alphateam/bze/x/burner/types";

// Params defines the parameters for the module.
message Params {
  option (amino.name) = "bze/x/burner/Params";
  option (gogoproto.equal) = true;

  int64 periodic_burning_weeks = 1 [(gogoproto.moretags) = "yaml:\"periodic_burning_weeks\""];
  // ibc_move_max_reserve_ratio caps one MsgMoveIbcLockedCoins: it moves at most this share of the pool's reserve of
  // the IBC denom. Valid in (0, 1].
  string ibc_move_max_reserve_ratio = 2 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true,
    (gogoproto.moretags) = "yaml:\"ibc_move_max_reserve_ratio\""
  ];
  // ibc_move_cooldown_blocks is the number of blocks that must pass after a successful MsgMoveIbcLockedCoins of a
  // denom before that denom can be moved again. At least 1.
  uint64 ibc_move_cooldown_blocks = 3 [
    (amino.dont_omitempty) = true,
    (gogoproto.moretags) = "yaml:\"ibc_move_cooldown_blocks\""
  ];
}
