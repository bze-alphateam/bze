syntax = "proto3";
package bze.rewards;

import "gogoproto/gogo.proto";

option go_package = "github.com/bze-alphateam/bze/x/rewards/types";

message StakingRewardCreateEvent {
  string reward_id = 1;
  string prize_amount = 2;
  string prize_denom = 3;
  string staking_denom = 4;
  uint32 duration = 5;
  uint64 min_stake = 6;
  uint32 lock = 7;
}

message StakingRewardUpdateEvent {
  string reward_id = 1;
  uint32 duration = 2;
}

message StakingRewardClaimEvent {
  string reward_id = 1;
  string address = 2;
  string amount = 3;
}

message StakingRewardJoinEvent {
  string reward_id = 1;
  string address = 2;
  string amount = 3;
}

message StakingRewardExitEvent {
  string reward_id = 1;
  string address = 2;
}

message StakingRewardFinishEvent {
  string reward_id = 1;
}

message StakingRewardDistributionEvent {
  string reward_id = 1;
  string amount = 2;
}

message TradingRewardCreateEvent {
  string reward_id = 1;
  string prize_amount = 2; //the amount paid as prize for each slot
  string prize_denom = 3; //the denom paid as prize
  uint32 duration = 4;
  string market_id = 5;
  uint32 slots = 6;
  string creator = 7;
}

message TradingRewardExpireEvent {
  string reward_id = 1;
}

message TradingRewardActivationEvent {
  string reward_id = 1;
}

message TradingRewardDistributionEvent {
  string reward_id = 1;
  string prize_amount = 2;
  string prize_denom = 3;
  repeated string winners = 4;
}

message DenomRewardCreateEvent {
  string denom = 1;
}

message DenomRewardJoinEvent {
  string denom = 1;
  string address = 2;
  string amount = 3;
}

message DenomRewardExitEvent {
  string denom = 1;
  string address = 2;
  string amount = 3; // the staked amount being withdrawn, in the DR's staking denom
}

message DenomRewardClaimEvent {
  string denom = 1;
  string address = 2;
  string amounts = 3; // sdk.Coins rendered as string
}

message DenomRewardPrizeCreateEvent {
  string denom = 1;
  string prize_denom = 2;
}

message DenomRewardScheduleCreateEvent {
  string schedule_id = 1;
  string denom = 2;
  string prize_denom = 3;
  string daily_amount = 4;
  uint32 duration = 5;
}

message DenomRewardScheduleUpdateEvent {
  string schedule_id = 1;
  uint32 duration = 2;
}

message DenomRewardScheduleFinishEvent {
  string schedule_id = 1;
}

message DenomRewardDistributionEvent {
  string denom = 1;
  string prize_denom = 2;
  string amount = 3;
}
