syntax = "proto3";
package bze.rewards;

import "gogoproto/gogo.proto";

option go_package = "github.com/bze-alphateam/bze/x/rewards/types";

message StakingReward {
  string reward_id = 1;
  string prize_amount = 2;
  string prize_denom = 3;
  string staking_denom = 4;
  uint32 duration = 5;
  uint32 payouts = 6;
  uint64 min_stake = 7;
  uint32 lock = 8;
  string staked_amount = 9; // T
  string distributed_stake = 10; // S
}

message StakingRewardParticipant {
  string address = 1;
  string reward_id = 2;
  string amount = 3; // stake[address]
  string joined_at = 4; // S0[address]
}

message PendingUnlockParticipant {
  string index = 1;
  string address = 2;
  string amount = 3;
  string denom = 4;
}

message UnlockParticipantsQueue {
  repeated uint64 unlockEpochs = 1;
}

message TradingReward {
  string reward_id = 1;
  string prize_amount = 2;
  string prize_denom = 3;
  uint32 duration = 4;
  string market_id = 5;
  uint32 slots = 6;
  uint32 expire_at = 7;
}

message TradingRewardExpiration {
  string reward_id = 1;
  uint32 expire_at = 2;
}

message TradingRewardLeaderboard {
  string reward_id = 1;
  repeated TradingRewardLeaderboardEntry list = 2 [(gogoproto.nullable) = false];
}

message TradingRewardLeaderboardEntry {
  string amount = 1;
  string address = 2;
  int64 created_at = 3;
}

message TradingRewardCandidate {
  string reward_id = 1;
  string amount = 2;
  string address = 3;
}

message MarketIdTradingRewardId {
  string reward_id = 1;
  string market_id = 2;
}

message StakingRewardsDistributionQueue {
  bool pending = 1;
  string cursor = 2;
}

message TradingRewardExpirationQueue {
  repeated uint32 removal_epochs = 1;
}

// DenomReward is a generic per-denom staking pool. One DenomReward exists per
// staking denom (unique chain-wide). lock and min_stake are snapshotted from the
// module params at creation time and never change afterwards.
message DenomReward {
  string staking_denom = 1; // identity - one DenomReward per denom
  uint32 lock          = 2; // days; snapshot from params at creation
  uint64 min_stake     = 3; // snapshot from params at creation
  string staked_amount = 4; // total staked T (Int as string)
}

// DenomRewardPrize is the accumulator for a (staking_denom, prize_denom) pair.
message DenomRewardPrize {
  string staking_denom           = 1;
  string prize_denom             = 2;
  string distributed_stake       = 3; // S (LegacyDec as string), starts "0"
  int64  last_distribution_epoch = 4; // day-epoch count of last distribution
}

// DenomRewardParticipant is a staker's position in a DenomReward.
message DenomRewardParticipant {
  string address       = 1;
  string staking_denom = 2;
  string amount        = 3; // stake[address] (Int as string)
}

// DenomRewardParticipantIndex records the accumulator value S seen at the
// participant's last settlement for a given prize denom.
message DenomRewardParticipantIndex {
  string address       = 1;
  string staking_denom = 2;
  string prize_denom   = 3;
  string index         = 4; // S at last settlement (LegacyDec as string)
}

// DenomRewardSchedule is an SR-style reward campaign attached to a DenomReward.
message DenomRewardSchedule {
  string schedule_id   = 1; // zero-filled global counter
  string staking_denom = 2;
  string prize_denom   = 3;
  string daily_amount  = 4; // Int as string
  uint32 duration      = 5; // days
  uint32 payouts       = 6; // days already distributed
}

// DenomRewardsDistributionQueue mirrors StakingRewardsDistributionQueue for the
// daily distribution of denom reward schedules.
message DenomRewardsDistributionQueue {
  bool   pending = 1;
  string cursor  = 2; // last processed schedule composite key
}
