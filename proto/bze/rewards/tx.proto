syntax = "proto3";

package bze.rewards;

import "amino/amino.proto";
import "cosmos/msg/v1/msg.proto";
import "cosmos/base/v1beta1/coin.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";
import "bze/rewards/params.proto";

option go_package = "github.com/bze-alphateam/bze/x/rewards/types";

// Msg defines the Msg service.
service Msg {
  option (cosmos.msg.v1.service) = true;
  
  // UpdateParams defines a (governance) operation for updating the module
  // parameters. The authority defaults to the x/gov module account.
  rpc UpdateParams             (MsgUpdateParams            ) returns (MsgUpdateParamsResponse            );
  rpc CreateStakingReward      (MsgCreateStakingReward     ) returns (MsgCreateStakingRewardResponse     );
  rpc UpdateStakingReward      (MsgUpdateStakingReward     ) returns (MsgUpdateStakingRewardResponse     );
  rpc JoinStaking              (MsgJoinStaking             ) returns (MsgJoinStakingResponse             );
  rpc ExitStaking              (MsgExitStaking             ) returns (MsgExitStakingResponse             );
  rpc ClaimStakingRewards      (MsgClaimStakingRewards     ) returns (MsgClaimStakingRewardsResponse     );
  rpc DistributeStakingRewards (MsgDistributeStakingRewards) returns (MsgDistributeStakingRewardsResponse);
  rpc CreateTradingReward      (MsgCreateTradingReward     ) returns (MsgCreateTradingRewardResponse     );
  rpc ActivateTradingReward    (MsgActivateTradingReward   ) returns (MsgActivateTradingRewardResponse   );
  rpc DeleteStakingReward      (MsgDeleteStakingReward     ) returns (MsgDeleteStakingRewardResponse     );
  rpc CreateDenomReward        (MsgCreateDenomReward       ) returns (MsgCreateDenomRewardResponse       );
  rpc JoinDenomReward          (MsgJoinDenomReward         ) returns (MsgJoinDenomRewardResponse         );
  rpc ExitDenomReward          (MsgExitDenomReward         ) returns (MsgExitDenomRewardResponse         );
  rpc ClaimDenomRewards        (MsgClaimDenomRewards       ) returns (MsgClaimDenomRewardsResponse       );
  rpc CreateDenomRewardSchedule (MsgCreateDenomRewardSchedule) returns (MsgCreateDenomRewardScheduleResponse);
  rpc UpdateDenomRewardSchedule (MsgUpdateDenomRewardSchedule) returns (MsgUpdateDenomRewardScheduleResponse);
  rpc DistributeDenomRewards   (MsgDistributeDenomRewards  ) returns (MsgDistributeDenomRewardsResponse  );
}
// MsgUpdateParams is the Msg/UpdateParams request type.
message MsgUpdateParams {
  option (cosmos.msg.v1.signer) =                     "authority";
  option           (amino.name) = "bze/x/rewards/MsgUpdateParams";
  
  // authority is the address that controls the module (defaults to x/gov unless overwritten).
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // params defines the module parameters to update.
  
  // NOTE: All parameters must be supplied.
  Params params = 2 [(gogoproto.nullable) = false, (amino.dont_omitempty) = true];
}

// MsgUpdateParamsResponse defines the response structure for executing a
// MsgUpdateParams message.
message MsgUpdateParamsResponse {}

message MsgCreateStakingReward {
  option           (amino.name) = "bze/x/rewards/MsgCreateStakingReward";
  option (cosmos.msg.v1.signer) = "creator";
  string creator       = 1;
  string prize_amount  = 2;
  string prize_denom   = 3;
  string staking_denom = 4;
  string duration      = 5;
  string min_stake     = 6;
  string lock          = 7;
}

message MsgCreateStakingRewardResponse {
  string reward_id = 1;
}

message MsgUpdateStakingReward {
  option           (amino.name) = "bze/x/rewards/MsgUpdateStakingReward";
  option (cosmos.msg.v1.signer) = "creator";
  string creator   = 1;
  string reward_id = 2;
  string duration  = 3;
}

message MsgUpdateStakingRewardResponse {}

message MsgJoinStaking {
  option           (amino.name) = "bze/x/rewards/MsgJoinStaking";
  option (cosmos.msg.v1.signer) = "creator";
  string creator   = 1;
  string reward_id = 2;
  string amount    = 3;
}

message MsgJoinStakingResponse {}

message MsgExitStaking {
  option           (amino.name) = "bze/x/rewards/MsgExitStaking";
  option (cosmos.msg.v1.signer) = "creator";
  string creator   = 1;
  string reward_id = 2;
}

message MsgExitStakingResponse {}

message MsgClaimStakingRewards {
  option           (amino.name) = "bze/x/rewards/MsgClaimStakingRewards";
  option (cosmos.msg.v1.signer) = "creator";
  string creator   = 1;
  string reward_id = 2;
}

message MsgClaimStakingRewardsResponse {
  string amount = 1;
}

message MsgDistributeStakingRewards {
  option           (amino.name) = "bze/x/rewards/MsgDistributeStakingRewards";
  option (cosmos.msg.v1.signer) = "creator";
  string creator   = 1;
  string reward_id = 2;
  string amount    = 3;
}

message MsgDistributeStakingRewardsResponse {}

message MsgCreateTradingReward {
  option           (amino.name) = "bze/x/rewards/MsgCreateTradingReward";
  option (cosmos.msg.v1.signer) = "creator";
  string creator      = 1;
  string prize_amount = 2;
  string prize_denom  = 3;
  string duration     = 4;
  string market_id    = 5;
  string slots        = 6;
}

message MsgCreateTradingRewardResponse {
  string reward_id = 1;
}

message MsgActivateTradingReward {
  option           (amino.name) = "bze/x/rewards/MsgActivateTradingReward";
  option (cosmos.msg.v1.signer) = "creator";
  string creator  = 1;
  string reward_id = 2;
}

message MsgActivateTradingRewardResponse {}

// MsgDeleteStakingReward - permissionless cleanup of a finished, emptied
// staking reward record whose deletion was previously suppressed by a hook.
message MsgDeleteStakingReward {
  option           (amino.name) = "bze/x/rewards/MsgDeleteStakingReward";
  option (cosmos.msg.v1.signer) = "creator";
  string creator   = 1;
  string reward_id = 2;
}

message MsgDeleteStakingRewardResponse {}

// Denom Rewards messages. Service RPCs are added in the handler stories
// (alongside autocli), mirroring how the module was built so far.
message MsgCreateDenomReward {
  option           (amino.name) = "bze/x/rewards/MsgCreateDenomReward";
  option (cosmos.msg.v1.signer) = "creator";
  string creator = 1;
  string denom   = 2;
}

message MsgCreateDenomRewardResponse {}

message MsgJoinDenomReward {
  option           (amino.name) = "bze/x/rewards/MsgJoinDenomReward";
  option (cosmos.msg.v1.signer) = "creator";
  string creator = 1;
  string denom   = 2;
  string amount  = 3;
}

message MsgJoinDenomRewardResponse {}

message MsgExitDenomReward {
  option           (amino.name) = "bze/x/rewards/MsgExitDenomReward";
  option (cosmos.msg.v1.signer) = "creator";
  string creator = 1;
  string denom   = 2;
}

message MsgExitDenomRewardResponse {}

message MsgClaimDenomRewards {
  option           (amino.name) = "bze/x/rewards/MsgClaimDenomRewards";
  option (cosmos.msg.v1.signer) = "creator";
  string creator = 1;
  string denom   = 2;
}

message MsgClaimDenomRewardsResponse {
  repeated cosmos.base.v1beta1.Coin amounts = 1 [
    (gogoproto.nullable)     = false,
    (gogoproto.moretags)     = "yaml:\"amounts\"",
    (gogoproto.jsontag)      = "amounts,omitempty"
  ];
}

message MsgCreateDenomRewardSchedule {
  option           (amino.name) = "bze/x/rewards/MsgCreateDenomRewardSchedule";
  option (cosmos.msg.v1.signer) = "creator";
  string creator      = 1;
  string denom        = 2;
  string prize_denom  = 3;
  string daily_amount = 4;
  string duration     = 5;
}

message MsgCreateDenomRewardScheduleResponse {
  string schedule_id = 1;
}

message MsgUpdateDenomRewardSchedule {
  option           (amino.name) = "bze/x/rewards/MsgUpdateDenomRewardSchedule";
  option (cosmos.msg.v1.signer) = "creator";
  string creator     = 1;
  string denom       = 2;
  string schedule_id = 3;
  string duration    = 4;
}

message MsgUpdateDenomRewardScheduleResponse {}

message MsgDistributeDenomRewards {
  option           (amino.name) = "bze/x/rewards/MsgDistributeDenomRewards";
  option (cosmos.msg.v1.signer) = "creator";
  string creator     = 1;
  string denom       = 2;
  string prize_denom = 3;
  string amount      = 4;
}

message MsgDistributeDenomRewardsResponse {}

