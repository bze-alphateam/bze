syntax = "proto3";
package bze.dao;

import "amino/amino.proto";
import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";
import "google/protobuf/any.proto";
import "bze/dao/params.proto";
import "bze/dao/store.proto";

option go_package = "github.com/bze-alphateam/bze/x/dao/types";

// Msg defines the Msg service.
service Msg {
  option (cosmos.msg.v1.service) = true;

  // UpdateParams defines a (governance) operation for updating the module
  // parameters. The authority defaults to the x/gov module account.
  rpc UpdateParams (MsgUpdateParams) returns (MsgUpdateParamsResponse);

  // CreateDao creates a DAO with its own derived account. Anyone can create one;
  // the creator pays the creation fee.
  rpc CreateDao (MsgCreateDao) returns (MsgCreateDaoResponse);

  // AdminExecute lets the external admin of a DAO run messages as the DAO.
  // Every message must be signed by the DAO account only.
  rpc AdminExecute (MsgAdminExecute) returns (MsgAdminExecuteResponse);

  // NominateAdmin is the first step of the admin handover: the current admin
  // nominates a successor, who accepts later. An empty nominee hands the DAO to
  // its own voters at once.
  rpc NominateAdmin (MsgNominateAdmin) returns (MsgNominateAdminResponse);

  // AcceptAdminNomination is the second step of the admin handover: the
  // pending nominee accepts and becomes the DAO's admin.
  rpc AcceptAdminNomination (MsgAcceptAdminNomination) returns (MsgAcceptAdminNominationResponse);

  // WithdrawAdminNomination lets the current admin cancel a pending handover
  // before the nominee accepts it.
  rpc WithdrawAdminNomination (MsgWithdrawAdminNomination) returns (MsgWithdrawAdminNominationResponse);
}

// MsgUpdateParams is the Msg/UpdateParams request type.
message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "bze/x/dao/MsgUpdateParams";

  // authority is the address that controls the module (defaults to x/gov unless overwritten).
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // params defines the module parameters to update.
  // NOTE: All parameters must be supplied.
  Params params = 2 [(gogoproto.nullable) = false, (amino.dont_omitempty) = true];
}

// MsgUpdateParamsResponse defines the response structure for executing a
// MsgUpdateParams message.
message MsgUpdateParamsResponse {}

// MsgCreateDao is the Msg/CreateDao request type.
message MsgCreateDao {
  option (cosmos.msg.v1.signer) = "creator";
  option (amino.name) = "bze/x/dao/MsgCreateDao";

  // creator pays the creation fee.
  string creator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  // admin is optional; empty makes the DAO self-owned (admin = the DAO address).
  string admin = 2;
  DaoType type = 3;
  string name = 4;
  string description = 5;
  DaoConfig config = 6 [(gogoproto.nullable) = false, (amino.dont_omitempty) = true];
  // members is the electorate of a DAO_TYPE_STATIC_LIST DAO.
  repeated string members = 7;
  // electorate is the electorate of a DAO_TYPE_STAKE DAO.
  StakeElectorate electorate = 8;
}

// MsgCreateDaoResponse is the Msg/CreateDao response type.
message MsgCreateDaoResponse {
  uint64 id = 1;
  string address = 2;
}

// MsgAdminExecute is the Msg/AdminExecute request type.
message MsgAdminExecute {
  option (cosmos.msg.v1.signer) = "admin";
  option (amino.name) = "bze/x/dao/MsgAdminExecute";

  // admin must be the DAO's admin at execution time; a self-owned DAO has none.
  string admin = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 dao_id = 2;
  // msgs run in order as the DAO; any failure reverts the whole transaction.
  repeated google.protobuf.Any msgs = 3 [(cosmos_proto.accepts_interface) = "cosmos.base.v1beta1.Msg"];
}

// MsgAdminExecuteResponse is the Msg/AdminExecute response type.
message MsgAdminExecuteResponse {}

// MsgNominateAdmin is the Msg/NominateAdmin request type.
message MsgNominateAdmin {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "bze/x/dao/MsgNominateAdmin";

  // authority must be the DAO's current admin (the DAO itself when self-owned).
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 dao_id = 2;
  // nominee becomes the pending admin; empty makes the DAO self-owned at once.
  string nominee = 3;
}

// MsgNominateAdminResponse is the Msg/NominateAdmin response type.
message MsgNominateAdminResponse {}

// MsgAcceptAdminNomination is the Msg/AcceptAdminNomination request type.
message MsgAcceptAdminNomination {
  option (cosmos.msg.v1.signer) = "nominee";
  option (amino.name) = "bze/x/dao/MsgAcceptAdminNomination";

  // nominee must be the DAO's pending admin; a DAO accepts through its own
  // proposal or admin.
  string nominee = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 dao_id = 2;
}

// MsgAcceptAdminNominationResponse is the Msg/AcceptAdminNomination response type.
message MsgAcceptAdminNominationResponse {}

// MsgWithdrawAdminNomination is the Msg/WithdrawAdminNomination request type.
message MsgWithdrawAdminNomination {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "bze/x/dao/MsgWithdrawAdminNomination";

  // authority must be the DAO's current admin (the DAO itself when self-owned).
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 dao_id = 2;
}

// MsgWithdrawAdminNominationResponse is the Msg/WithdrawAdminNomination response type.
message MsgWithdrawAdminNominationResponse {}
