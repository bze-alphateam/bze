syntax = "proto3";
package bze.dao;

import "bze/dao/store.proto";

option go_package = "github.com/bze-alphateam/bze/x/dao/types";

// EventDaoCreated is emitted when a DAO is created.
message EventDaoCreated {
  uint64 id = 1;
  string address = 2;
  string admin = 3;
  DaoType type = 4;
}

// EventAdminExecuted is emitted when a DAO's admin runs messages as the DAO.
message EventAdminExecuted {
  uint64 id = 1;
  string admin = 2;
  uint64 msg_count = 3;
}

// EventAdminNominated is emitted when a DAO's admin nominates a successor.
message EventAdminNominated {
  uint64 id = 1;
  string admin = 2;
  string nominee = 3;
}

// EventAdminChanged is emitted when a DAO's admin changes.
message EventAdminChanged {
  uint64 id = 1;
  string old_admin = 2;
  string new_admin = 3;
}

// EventAdminNominationWithdrawn is emitted when a DAO's admin withdraws a
// pending nomination.
message EventAdminNominationWithdrawn {
  uint64 id = 1;
  string nominee = 2;
}
