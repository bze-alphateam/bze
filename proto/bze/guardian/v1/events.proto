syntax = "proto3";
package bze.guardian.v1;

option go_package = "github.com/bze-alphateam/bze/x/guardian/types";

// TightenRateLimitEvent is emitted when a rate limit quota is lowered.
message TightenRateLimitEvent {
  string signer = 1;
  string denom = 2;
  string channel_id = 3;
  string old_send = 4;
  string old_recv = 5;
  string new_send = 6;
  string new_recv = 7;
}

// DenomBlockedEvent is emitted when a denom is put on the blacklist.
message DenomBlockedEvent {
  string signer = 1;
  string denom = 2;
}

// DenomUnblockedEvent is emitted when a denom is taken off the blacklist.
message DenomUnblockedEvent {
  string authority = 1;
  string denom = 2;
}

// AutomationPausedEvent is emitted when the protocol automation is paused.
message AutomationPausedEvent {
  string signer = 1;
}

// AutomationResumedEvent is emitted when governance resumes the protocol
// automation.
message AutomationResumedEvent {
  string authority = 1;
}
