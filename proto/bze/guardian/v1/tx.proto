syntax = "proto3";
package bze.guardian.v1;

import "amino/amino.proto";
import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";
import "bze/guardian/v1/params.proto";

option go_package = "github.com/bze-alphateam/bze/x/guardian/types";

// Msg defines the Msg service.
service Msg {
  option (cosmos.msg.v1.service) = true;

  // UpdateParams defines a (governance) operation for updating the module
  // parameters. The authority defaults to the x/gov module account.
  rpc UpdateParams (MsgUpdateParams) returns (MsgUpdateParamsResponse);

  // TightenRateLimit lowers the send and receive quotas of an existing IBC
  // rate limit. It can never raise a quota, change the window or add a limit.
  rpc TightenRateLimit (MsgTightenRateLimit) returns (MsgTightenRateLimitResponse);

  // BlockDenom puts a denom on the rate limit module's blacklist: every ICS-20
  // transfer of the denom is refused, in both directions, on every channel.
  rpc BlockDenom (MsgBlockDenom) returns (MsgBlockDenomResponse);

  // UnblockDenom takes a denom off the blacklist. Governance only.
  rpc UnblockDenom (MsgUnblockDenom) returns (MsgUnblockDenomResponse);

  // PauseAutomation stops the protocol's own automatic fund movements: the
  // txfeecollector EndBlock conversions and the burner's periodic burn.
  rpc PauseAutomation (MsgPauseAutomation) returns (MsgPauseAutomationResponse);

  // ResumeAutomation lifts the pause. Governance only.
  rpc ResumeAutomation (MsgResumeAutomation) returns (MsgResumeAutomationResponse);
}

// MsgUpdateParams is the Msg/UpdateParams request type.
message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "bze/x/guardian/MsgUpdateParams";

  // authority is the address that controls the module (defaults to x/gov unless overwritten).
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // params defines the module parameters to update.
  // NOTE: All parameters must be supplied.
  Params params = 2 [(gogoproto.nullable) = false, (amino.dont_omitempty) = true];
}

// MsgUpdateParamsResponse defines the response structure for executing a
// MsgUpdateParams message.
message MsgUpdateParamsResponse {}

// MsgTightenRateLimit is the Msg/TightenRateLimit request type.
message MsgTightenRateLimit {
  option (cosmos.msg.v1.signer) = "signer";
  option (amino.name) = "bze/x/guardian/MsgTightenRateLimit";

  // signer is the guardian or the governance authority.
  string signer = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  // denom of the rate limit, as it appears on BZE.
  string denom = 2;
  // channel_id of the rate limit, on the BZE side.
  string channel_id = 3;
  // max_percent_send is the new outflow threshold, at most the current one.
  string max_percent_send = 4 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];
  // max_percent_recv is the new inflow threshold, at most the current one.
  string max_percent_recv = 5 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];
}

// MsgTightenRateLimitResponse defines the response structure for executing a
// MsgTightenRateLimit message.
message MsgTightenRateLimitResponse {}

// MsgBlockDenom is the Msg/BlockDenom request type.
message MsgBlockDenom {
  option (cosmos.msg.v1.signer) = "signer";
  option (amino.name) = "bze/x/guardian/MsgBlockDenom";

  // signer is the guardian or the governance authority.
  string signer = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  // denom to block, as it appears on BZE.
  string denom = 2;
}

// MsgBlockDenomResponse defines the response structure for executing a
// MsgBlockDenom message.
message MsgBlockDenomResponse {}

// MsgUnblockDenom is the Msg/UnblockDenom request type.
message MsgUnblockDenom {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "bze/x/guardian/MsgUnblockDenom";

  // authority is the governance module account, the guardian cannot unblock.
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  // denom to unblock, as it appears on BZE.
  string denom = 2;
}

// MsgUnblockDenomResponse defines the response structure for executing a
// MsgUnblockDenom message.
message MsgUnblockDenomResponse {}

// MsgPauseAutomation is the Msg/PauseAutomation request type.
message MsgPauseAutomation {
  option (cosmos.msg.v1.signer) = "signer";
  option (amino.name) = "bze/x/guardian/MsgPauseAutomation";

  // signer is the guardian or the governance authority.
  string signer = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}

// MsgPauseAutomationResponse defines the response structure for executing a
// MsgPauseAutomation message.
message MsgPauseAutomationResponse {}

// MsgResumeAutomation is the Msg/ResumeAutomation request type.
message MsgResumeAutomation {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "bze/x/guardian/MsgResumeAutomation";

  // authority is the governance module account, the guardian cannot resume.
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}

// MsgResumeAutomationResponse defines the response structure for executing a
// MsgResumeAutomation message.
message MsgResumeAutomationResponse {}
